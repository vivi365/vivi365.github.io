{% assign familiar = site.data.daily_familiar %}
<aside id="daily-familiar" class="daily-familiar" hidden aria-label="tilde, daily familiar">
  <button class="daily-familiar__trigger" type="button" aria-expanded="false" aria-controls="daily-familiar-card">
    <img class="daily-familiar__image" alt="" width="450" height="480" draggable="false" hidden>
    <span class="daily-familiar__sleep-indicator" aria-hidden="true">z</span>
    <span class="daily-familiar__sr-only">Open tilde</span>
  </button>
  <div id="daily-familiar-card" class="daily-familiar__card" role="region" aria-labelledby="daily-familiar-title" hidden>
    <button class="daily-familiar__close" type="button" aria-label="Close">×</button>
    <div class="daily-familiar__body">
      <h2 id="daily-familiar-title" class="daily-familiar__label"></h2>
      <p class="daily-familiar__text"></p>
      <p class="daily-familiar__attribution" hidden></p>
      <a class="daily-familiar__link" hidden></a>
      <div class="daily-familiar__customize">
        <div class="daily-familiar__looks" role="group" aria-label="Choose tilde's look"></div>
      </div>
    </div>
  </div>
</aside>
<div id="daily-familiar-bank" hidden aria-hidden="true">
  <div data-familiar-config data-timezone="{{ familiar.timezone | default: 'Europe/Stockholm' | escape }}" data-delay-ms="{{ familiar.delay_ms | default: 1200 | escape }}"></div>
  {% for pet in familiar.pets %}<div data-familiar-pet data-id="{{ pet.id | escape }}" data-image="{{ pet.image | escape }}" data-alt="{{ pet.alt | escape }}" data-label="{{ pet.label | escape }}"></div>{% endfor %}
  {% for message in familiar.messages %}<div data-familiar-message data-id="{{ message.id | escape }}" data-text="{{ message.text | escape }}" data-attribution="{{ message.attribution | default: '' | escape }}" data-link="{{ message.link | default: '' | escape }}"></div>{% endfor %}
</div>
<script src="{{ '/assets/js/daily-familiar.js' | relative_url }}" defer></script>
